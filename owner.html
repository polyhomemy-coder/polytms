<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POLYHOME — Owner Portal</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#007B8A;--brand2:#00B4CC;--orange:#F4811F;
  --bg:#F4F7FA;--card:#fff;--ink:#0F2A36;--muted:#6B8E99;
  --line:#E2ECF0;--th-bg:#F0F7FA;--radius:16px;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow:0 2px 12px rgba(0,0,0,.06);--shadow-md:0 4px 24px rgba(0,0,0,.09);
  --content-max:1100px;
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh}

/* ── Login — full-screen glass ── */
#loginOverlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
#loginOverlay.hidden{display:none}


/* Glass card */
.glass-card{
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.15);
  border-radius:28px;
  padding:44px 40px 36px;
  width:100%;max-width:400px;
  box-shadow:0 24px 64px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);
  animation:cardIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

.glass-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.glass-inp{width:100%;background:transparent;border:none;border-bottom:1.5px solid rgba(255,255,255,.25);
  padding:10px 0;font-size:15px;font-family:var(--font);color:#fff;outline:none;
  transition:border-color .2s;caret-color:#00B4CC}
.glass-inp::placeholder{color:rgba(255,255,255,.25)}
.glass-inp:focus{border-bottom-color:#00B4CC}
.glass-inp:-webkit-autofill{-webkit-text-fill-color:#fff;-webkit-box-shadow:0 0 0 100px transparent inset;transition:background-color 9999s}
.glass-btn{width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:800;
  border:none;cursor:pointer;font-family:var(--font);
  background:linear-gradient(135deg,#00626E,#00B4CC);
  color:#fff;letter-spacing:.3px;
  box-shadow:0 4px 20px rgba(0,180,204,.3);transition:filter .2s,transform .1s}
.glass-btn:hover{filter:brightness(1.1)}
.glass-btn:active{transform:scale(.98)}

/* ── App shell ── */
#app{display:none;flex-direction:column;min-height:100vh}
#app.visible{display:flex}

/* ── Top header ── */
#topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 16px;
  height:56px;display:flex;align-items:center;gap:8px;overflow:hidden;
  position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.topbar-logo{flex-shrink:1;min-width:0;overflow:hidden}
.topbar-logo img{height:26px;width:auto;max-width:140px;object-fit:contain;display:block}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.topbar-user{font-size:12px;color:var(--muted);font-weight:600;
  white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
/* view toggle removed — auto responsive */
.btn-signout{padding:8px 14px;border-radius:9px;border:1.5px solid var(--line);
  background:#fff;color:var(--muted);font-size:12px;font-weight:700;
  cursor:pointer;font-family:var(--font);transition:all .15s;
  -webkit-tap-highlight-color:rgba(192,57,43,.15);touch-action:manipulation;
  min-height:36px;min-width:44px}
.btn-signout:hover,.btn-signout:active{border-color:#C0392B;color:#C0392B;background:#FFF5F5}

/* ── Property selector bar ── */
#propBar{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;
  display:flex;align-items:center;gap:8px;overflow-x:auto;flex-wrap:nowrap}
#propBar::-webkit-scrollbar{display:none}
#propBar.hidden{display:none}
.prop-pill{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700;
  cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--muted);
  font-family:var(--font);white-space:nowrap;transition:all .15s;flex-shrink:0}
.prop-pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.prop-pill:hover:not(.active){border-color:var(--brand);color:var(--brand)}

/* ── Tab nav — pill style ── */
#tabnav{background:#fff;border-bottom:1px solid var(--line);
  padding:8px 16px;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#tabnav::-webkit-scrollbar{display:none}
.tab-btn{padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--muted);
  border:1.5px solid transparent;background:transparent;
  cursor:pointer;border-radius:10px;white-space:nowrap;
  font-family:var(--font);transition:all .18s;flex-shrink:0}
.tab-btn:hover{background:var(--th-bg);color:var(--brand)}
.tab-btn.active{background:linear-gradient(135deg,#004C56,#007B8A);
  color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,76,86,.25)}

/* ── Content area ── */
#content{flex:1;padding:20px;max-width:var(--content-max);margin:0 auto;width:100%}

/* ── Cards ── */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);
  padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:14px;
  display:flex;align-items:center;gap:8px}

/* ── Stat grid ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:14px;border:1px solid var(--line);
  padding:16px 18px;box-shadow:var(--shadow)}
.stat-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:6px}
.stat-val{font-size:20px;font-weight:900;color:var(--brand);letter-spacing:-.5px}
.stat-val.orange{color:var(--orange)}

/* ── Tables ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--th-bg);padding:9px 12px;text-align:left;font-size:10px;
  font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:#F7FDFE}
.tbl tfoot td{background:var(--th-bg);border-top:2px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-green{background:#DCFCE7;color:#065F46}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-yellow{background:#FEF3C7;color:#92400E}
.badge-blue{background:#E8F4FD;color:#1E5BB8}
.badge-gray{background:#F1F5F9;color:#64748B}

/* ── Room cards (mobile tenant view) ── */
.room-grid{display:grid;grid-template-columns:1fr;gap:12px}
.room-card{background:var(--card);border-radius:14px;border:1px solid var(--line);
  padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px}
.room-card:hover{box-shadow:var(--shadow-md);border-color:var(--brand)}
.room-card.vacant{opacity:.65}
.room-badge{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#007B8A,#00B4CC);
  color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.room-card.vacant .room-badge{background:#E2ECF0;color:var(--muted)}
.room-info{flex:1;min-width:0}
.room-name{font-size:15px;font-weight:800;color:var(--ink)}
.room-tenant{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-rental{font-size:14px;font-weight:800;color:var(--orange);text-align:right;white-space:nowrap}
.room-arrow{color:var(--muted);font-size:16px;flex-shrink:0}

/* ── Tenant detail modal ── */
#tenantModal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#tenantModal.hidden{display:none}
.tenant-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;
  max-height:85vh;overflow-y:auto;padding:20px}
@media(min-width:640px){
  #tenantModal{align-items:center}
  .tenant-sheet{border-radius:20px;max-height:80vh}
}
.tenant-sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--line);
  margin:0 auto 16px}
.tenant-detail-row{display:flex;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;gap:12px}
.tenant-detail-row:last-child{border-bottom:none}
.detail-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;min-width:110px;flex-shrink:0;padding-top:1px}
.detail-value{font-size:13px;font-weight:600;color:var(--ink);flex:1}

/* ── Month picker row ── */
.picker-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.picker-row label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.picker-row select{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;font-size:13px;font-weight:600;color:var(--ink);font-family:var(--font);outline:none}

/* ── Report iframe ── */
.report-iframe-wrap{border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);margin-bottom:16px}
#reportFrame{width:100%;min-height:650px;border:none;display:block}

/* ── Bar chart ── */
.bar-wrap{display:flex;align-items:flex-end;gap:5px;height:140px;padding:0 4px;margin-bottom:8px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.bar-label{font-size:9px;font-weight:700;color:var(--muted);white-space:nowrap}
.bar-val{font-size:8px;font-weight:800;color:var(--brand)}
.legend-row{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* ── Electricity ── */
.elec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.elec-card{background:var(--th-bg);border-radius:12px;border:1px solid var(--line);padding:12px 14px}
.elec-month{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:6px}
.elec-inp{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);
  background:#fff;font-size:13px;font-weight:700;color:var(--ink);
  font-family:var(--font);text-align:right;outline:none}
.elec-inp:focus{border-color:var(--brand2)}
.elec-aircon{font-size:11px;color:var(--muted);margin-top:4px}
.elec-diff{font-size:11px;font-weight:700;margin-top:3px}
.btn-save-elec{padding:10px 22px;border-radius:11px;background:var(--brand);color:#fff;
  font-size:13px;font-weight:800;border:none;cursor:pointer;font-family:var(--font);
  margin-top:16px;box-shadow:0 3px 10px rgba(0,123,138,.3);transition:filter .15s}
.btn-save-elec:hover{filter:brightness(1.08)}

/* ── Action buttons ── */
.btn-export{padding:9px 18px;border-radius:10px;background:var(--orange);color:#fff;
  font-size:13px;font-weight:800;border:none;cursor:pointer;font-family:var(--font);
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 3px 10px rgba(244,129,31,.3);transition:filter .15s}
.btn-export:hover{filter:brightness(1.08)}

/* ── Locked notice ── */
.locked-notice{background:#F8FAFF;border:2px dashed #C5D5E8;border-radius:16px;
  padding:40px 20px;text-align:center;margin-bottom:16px}
.locked-notice .lock-icon{font-size:36px;margin-bottom:10px}
.locked-notice h3{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:6px}
.locked-notice p{font-size:13px;color:var(--muted);line-height:1.6;max-width:320px;margin:0 auto}

/* ── Empty ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}

/* ── Loading ── */
#loadingScreen{position:fixed;inset:0;background:#091922;display:flex;align-items:center;
  justify-content:center;z-index:300;flex-direction:column;gap:12px}
#loadingScreen.hidden{display:none}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);
  border-top-color:#00B4CC;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:rgba(255,255,255,.45);font-size:12px;font-weight:600;letter-spacing:.3px}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);
  background:#0F2A36;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;
  font-weight:700;z-index:9999;transition:transform .3s;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.bad{background:#C0392B}

/* ════════════════════════════════════
   DESKTOP — auto via media query (>=768px)
════════════════════════════════════ */
@media(min-width:768px){
  #content{padding:28px}
  .stat-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .room-grid{grid-template-columns:1fr 1fr}
  .elec-grid{grid-template-columns:repeat(4,1fr)}
}

/* ════════════════════════════════════
   MOBILE-SPECIFIC styles
   (default, applied without class)
════════════════════════════════════ */
@media(max-width:500px){
  .topbar-user{display:none}
  .btn-signout{padding:5px 8px;font-size:11px}
  #tabnav{padding:6px 8px;gap:3px}
  .tab-btn{padding:6px 9px;font-size:11px}
}
@media(max-width:360px){
  #topbar{padding:0 12px}
  .topbar-logo img{height:24px}
}

@media print{
  #topbar,#tabnav,#propBar,.picker-row,.btn-export,#toast,#loadingScreen,#tenantModal{display:none!important}
  #content{padding:0;max-width:100%}
  .card{border:none;box-shadow:none}
}
</style>
</head>

function renderReport(){
  const el=$('paneReport'); if(!el) return;
  const prop=state.properties.find(p=>p.id===state.activePropId);
  if(!prop){el.innerHTML=`<div class="empty">No property data.</div>`;return;}

  // Build month options (last 18 months); locked ones show 🔒
  const launchedSet=new Set(state.reportStatus.map(r=>`${r.year}-${String(r.month).padStart(2,'0')}`));
  const now=new Date(); let monthOpts='';
  for(let i=0;i<18;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const y=d.getFullYear(),m=d.getMonth()+1;
    const val=`${y}-${String(m).padStart(2,'0')}`;
    const isLaunched=launchedSet.has(val);
    const sel=(y===state.year&&m===state.month)?'selected':'';
    monthOpts+=`<option value="${val}" ${sel}>${MONTHS_FULL[m-1]} ${y}${isLaunched?'':' 🔒'}</option>`;
  }

  el.innerHTML=`
    <div class="picker-row">
      <label>Month</label>
      <select id="reportMonthPick" onchange="onReportMonthChange()">${monthOpts}</select>
    </div>
    <div id="reportContent"></div>`;
  renderReportContent();
}

function onReportMonthChange(){
  const v=$('reportMonthPick')?.value;
  if(v){const[y,m]=v.split('-').map(Number);state.year=y;state.month=m;}
  renderReportContent();
}

  const el=$('reportContent'); if(!el) return;
  const prop=state.properties.find(p=>p.id===state.activePropId);
  const y=state.year, m=state.month;

  const launchedRecord=state.reportStatus.find(r=>r.year===y&&r.month===m);

// CSS scoping helpers (same as TMS — prevents report styles leaking into host doc)
function _scopeFlatRules(css, scope){
  return css.replace(/([^{}@]+?)\{([^{}]*)\}/g, (_, sel, body)=>{
    const scoped = sel.split(',').map(s=>{
      s = s.trim();
      if(!s) return s;
      if(s.startsWith('@')) return s;
      if(s==='body' || s==='html') return scope;
      return scope + ' ' + s;
    }).join(', ');
    return `${scoped}{${body}}`;
  });
}
function _scopeReportCSS(css, scopeId){
  const scope = '#' + scopeId;
  let out = '', last = 0;
  const mediaRe = /@media[^{]*\{((?:[^{}]|\{[^{}]*\})*)\}/g;
  let m;
  while((m = mediaRe.exec(css)) !== null){
    out += _scopeFlatRules(css.substring(last, m.index), scope);
    if(m[0].includes('@page')){
      out += m[0];
    } else {
      const inner = _scopeFlatRules(m[1], scope);
      const head  = m[0].substring(0, m[0].indexOf('{')+1);
      out += head + inner + '}';
    }
    last = m.index + m[0].length;
  }
  out += _scopeFlatRules(css.substring(last), scope);
  return out;
}

// Lazy-load html2canvas + jsPDF individually (more reliable than html2pdf wrapper)
let _pdfLibsLoaded=false;
async function loadPdfLibs(){
  if(_pdfLibsLoaded&&window.html2canvas&&window.jspdf) return;
  const load=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  await load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  _pdfLibsLoaded=true;
}

async function exportReportPDF(){
  const prop=state.properties.find(p=>p.id===state.activePropId);
  const y=state.year, m=state.month;
  const launchedRecord=state.reportStatus.find(r=>r.year===y&&r.month===m);
  if(!prop||!launchedRecord){ toast('No report to export','bad'); return; }

  const btn=document.querySelector('.btn-export');
  if(btn){ btn.textContent='⏳ Generating…'; btn.disabled=true; }

  let overlay=null, host=null, styleEl=null;
  try{
    await loadPdfLibs();

    // Build the desktop report HTML
    const html=buildOwnerReportDesktopHTML(prop,y,m,launchedRecord);
    const styleMatch=html.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
    const bodyMatch =html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
    if(!styleMatch||!bodyMatch) throw new Error('Cannot parse report HTML');

    // Show loading overlay
    overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center';
    overlay.innerHTML='<div style="background:#fff;padding:28px 36px;border-radius:18px;text-align:center"><div style="font-size:32px">📄</div><div style="margin-top:10px;font-size:16px;font-weight:700;color:#007B8A">Generating PDF…</div><div style="font-size:12px;color:#888;margin-top:4px">Please wait</div></div>';
    document.body.appendChild(overlay);

    // Inject report CSS into head temporarily
    styleEl=document.createElement('style');
    styleEl.setAttribute('data-pdf-tmp','1');
    styleEl.textContent=styleMatch[1];
    document.head.appendChild(styleEl);

    // Mount report at the top of the page using position:absolute
    // so html2canvas can capture full height without viewport clipping
    host=document.createElement('div');
    host.id='_ownerPdfHost';
    host.style.cssText="position:absolute;left:0;top:0;width:1100px;background:#F0F9FB;font-family:'Plus Jakarta Sans',sans-serif;z-index:1;";
    host.innerHTML=bodyMatch[1];
    document.body.appendChild(host);

    // Let the browser paint
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    try{ await document.fonts.ready; }catch(_){}
    await new Promise(r=>setTimeout(r,600));

    // Capture with html2canvas directly — explicit width/height from the host
    const canvas=await window.html2canvas(host,{
      scale:2,
      useCORS:true,
      backgroundColor:'#F0F9FB',
      width:host.scrollWidth||1100,
      height:host.scrollHeight||2000,
      windowWidth:1100,
      logging:false,
      x:0, y:0,
    });

    // Build PDF page by page with jsPDF
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const margin=8, pgW=210, pgH=297;
    const cW=pgW-2*margin, cH=pgH-2*margin;
    const imgData=canvas.toDataURL('image/jpeg',0.92);
    const imgW=cW;
    const imgH=(canvas.height*imgW)/canvas.width;
    let posY=margin, remaining=imgH;
    pdf.addImage(imgData,'JPEG',margin,posY,imgW,imgH);
    remaining-=cH;
    while(remaining>0){
      pdf.addPage();
      posY=margin-(imgH-remaining);
      pdf.addImage(imgData,'JPEG',margin,posY,imgW,imgH);
      remaining-=cH;
    }

    const condo=(prop.condo||'property').replace(/\s+/g,'_');
    const unit=(prop.unit||'').replace(/\s+/g,'_');
    pdf.save(`${condo}_${unit}_${MONTHS_FULL[m-1]}_${y}_Income_Report.pdf`);

  }catch(e){
    toast('PDF failed: '+e.message,'bad');
  }finally{
    host?.remove();
    overlay?.remove();
    styleEl?.remove();
    if(btn){ btn.textContent='⬇️ PDF'; btn.disabled=false; }
  }
}

  const getTenant=code=>state.tenants.find(t=>(t.room_code||'').toUpperCase()===code.toUpperCase());

  const incomeRows=lines.map((l,i)=>{
    const t=getTenant(l.code);
    const tenancy=shortTenancy(t);
    const tenure=tenureMonthsFn(t);
    return `<tr><td class="n">${i+1}</td><td class="muted">Room</td><td class="muted">${escH(l.code)}</td>

function renderTenants(){
  const el=$('paneTenants'); if(!el) return;
  const prop=state.properties.find(p=>p.id===state.activePropId);
  if(!prop){el.innerHTML=`<div class="empty">No property data.</div>`;return;}

  const active=state.tenants.filter(t=>t.active!==false);
  const rooms=(prop.room_codes||'').split(',').map(r=>r.trim()).filter(Boolean);
  const vacantCount=rooms.filter(r=>!active.some(t=>(t.room_code||'').toUpperCase()===r.toUpperCase())).length;
  const totalRental=active.reduce((s,t)=>s+(Number(t.rental||0)+Number(t.carpark_rental||0)),0);
  const occupancyPct=rooms.length?Math.round((active.length/rooms.length)*100):0;

  // Stats
  const statsHtml=`
    <div class="stat-grid" style="margin-bottom:20px">
      <div class="stat-card"><div class="stat-label">Total Rooms</div><div class="stat-val">${rooms.length}</div></div>
      <div class="stat-card"><div class="stat-label">Occupied</div><div class="stat-val">${active.length}</div></div>
      <div class="stat-card"><div class="stat-label">Vacant</div><div class="stat-val" style="color:${vacantCount?'#C85900':'var(--brand)'}">${vacantCount}</div></div>
      <div class="stat-card"><div class="stat-label">Occupancy</div><div class="stat-val" style="color:${occupancyPct>=80?'#059669':occupancyPct>=50?'#D97706':'#C85900'}">${occupancyPct}%</div></div>
      <div class="stat-card"><div class="stat-label">Monthly Rental</div><div class="stat-val orange">RM ${fmt(totalRental)}</div></div>
    </div>`;

  // Room cards — tap each to see details
  const roomCards=rooms.map(r=>{
    const tenant=active.find(t=>(t.room_code||'').toUpperCase()===r.toUpperCase());
    if(tenant){
      const now=new Date(); const end=tenant.end_date?new Date(tenant.end_date):null;
      const days=end?Math.round((end-now)/86400000):null;
      const statusBadge=days===null?''
        :days<0?`<span class="badge badge-red" style="font-size:10px">Expired</span>`
        :days<=30?`<span class="badge badge-yellow" style="font-size:10px">⏰ ${days}d left</span>`
        :`<span class="badge badge-green" style="font-size:10px">Active</span>`;
      const rental=Number(tenant.rental||0)+Number(tenant.carpark_rental||0);
      return `<div class="room-card" onclick="openTenantDetail('${tenant.id}')">
        <div class="room-badge">${esc(r)}</div>
        <div class="room-info">
          <div class="room-name">${esc(tenant.name||'—')}</div>
          <div class="room-tenant">${tenant.end_date?'Lease ends '+tenant.end_date:'No end date'}</div>
          <div style="margin-top:4px">${statusBadge}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="room-rental">RM ${fmt(rental)}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">/month</div>
        </div>
        <div class="room-arrow">›</div>
      </div>`;
    } else {
      return `<div class="room-card vacant">
        <div class="room-badge">${esc(r)}</div>
        <div class="room-info">
          <div class="room-name">Room ${esc(r)}</div>
          <div class="room-tenant"><span class="badge badge-yellow">Vacant</span></div>
        </div>
        <div class="room-rental" style="color:var(--muted)">—</div>
        <div class="room-arrow" style="opacity:0">›</div>
      </div>`;
    }
  }).join('');

  el.innerHTML=statsHtml+`
    <div class="card" style="padding:16px">
      <div class="card-title" style="margin-bottom:12px">
        <span>🏠</span> Room Overview
        <span style="font-size:11px;color:var(--muted);font-weight:500;margin-left:auto">Tap a room to view tenant details</span>
      </div>
      <div class="room-grid">${roomCards}</div>
    </div>`;
}

function openTenantDetail(tenantId){
  const t=state.tenants.find(x=>x.id===tenantId);
  if(!t) return;

  const prop=state.properties.find(p=>p.id===state.activePropId);
  const now=new Date(); const end=t.end_date||t.agreement_end?new Date(t.end_date||t.agreement_end):null;
  const days=end?Math.round((end-now)/86400000):null;
  const statusBadge=days===null?'<span class="badge badge-gray">No end date</span>'
    :days<0?`<span class="badge badge-red">Expired ${Math.abs(days)}d ago</span>`
    :days<=30?`<span class="badge badge-yellow">⏰ ${days}d left</span>`
    :`<span class="badge badge-green">✓ Active</span>`;

  const fmtD=d=>{if(!d)return null;const dt=new Date(d);return`${dt.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()]} ${dt.getFullYear()}`;};
  const row=(label,value)=>{
    if(!value&&value!==0) return '';
    return `<div class="tenant-detail-row"><div class="detail-label">${label}</div><div class="detail-value">${esc(String(value))}</div></div>`;
  };
  const section=title=>`<div style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--brand);text-transform:uppercase;padding:14px 0 6px;border-bottom:2px solid var(--brand);margin-bottom:4px;margin-top:8px">${title}</div>`;

  const totalRental=Number(t.rental||t.room_rental||0)+Number(t.carpark_rental||0);
  const mo=(t.agreement_start&&t.agreement_end)?Math.round((new Date(t.agreement_end)-new Date(t.agreement_start))/(1000*60*60*24*30.44)):null;

  $('tenantDetailBody').innerHTML=`
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#007B8A,#00B4CC);
        color:#fff;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        ${esc(t.room_code||'?')}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:18px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.name||'Unknown')}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(prop?.condo||'')} ${esc(prop?.unit||'')} · Room ${esc(t.room_code||'')}</div>
      </div>
      <div style="flex-shrink:0">${statusBadge}</div>
    </div>

    <!-- Rental summary card -->
    <div style="background:linear-gradient(135deg,#F4811F,#FF9A45);border-radius:14px;padding:16px 18px;margin-bottom:16px;color:#fff;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:10px;font-weight:700;opacity:.75;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Monthly Total</div>
        <div style="font-size:28px;font-weight:900;line-height:1">RM ${fmt(totalRental)}</div>
        ${Number(t.carpark_rental||0)>0?`<div style="font-size:11px;opacity:.8;margin-top:3px">Room RM ${fmt(t.rental||t.room_rental||0)} + Carpark RM ${fmt(t.carpark_rental)}</div>`:''}
      </div>
      ${mo!=null?`<div style="text-align:right"><div style="font-size:10px;font-weight:700;opacity:.75;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Tenure</div><div style="font-size:22px;font-weight:900">${mo}<span style="font-size:12px;font-weight:600;margin-left:3px">mo</span></div></div>`:''}
    </div>

    <!-- PERSONAL INFO -->
    ${section('Personal Information')}
    ${row('Full Name', t.name)}
    ${row('IC / NRIC', t.ic||t.ic_number||t.nric)}
    ${row('Passport No.', t.passport_number||t.passport)}
    ${row('Gender', t.gender)}
    ${row('Race', t.race)}
    ${row('Nationality', t.nationality)}
    ${row('Marital Status', t.marital_status)}
    ${row('Date of Birth', fmtD(t.dob||t.date_of_birth))}
    ${row('No. of Occupants', t.no_of_staying||t.occupants)}

    <!-- CONTACT -->
    ${section('Contact')}
    ${row('Phone / WhatsApp', t.contact||t.phone||t.whatsapp)}
    ${row('Email', t.email)}
    ${row('Emergency Name', t.emergency_name)}
    ${row('Emergency Contact', t.emergency_contact)}

    <!-- OCCUPATION -->
    ${section('Occupation')}
    ${row('Occupation', t.occupation)}
    ${row('Company', t.company)}

    <!-- ROOM & TENANCY -->
    ${section('Room & Tenancy')}
    ${row('Room Code', t.room_code)}
    ${row('Carpark Lot', t.carpark)}
    ${row('Room Rental', (t.rental||t.room_rental) ? 'RM '+fmt(t.rental||t.room_rental) : null)}
    ${row('Carpark Rental', Number(t.carpark_rental||0)>0 ? 'RM '+fmt(t.carpark_rental) : null)}
    ${row('Agreement Start', fmtD(t.agreement_start||t.start_date))}
    ${row('Agreement End', fmtD(t.agreement_end||t.end_date))}
    ${row('Move-in Date', fmtD(t.move_in_date))}
    ${row('Move-out Date', fmtD(t.move_out_date))}
    ${row('Tenure', mo!=null ? mo+' months' : null)}

    <!-- Deposits & Keys hidden by owner request -->

    <!-- SECONDARY TENANT -->
    ${(t.secondary_name||t.secondary_ic) ? section('Secondary Tenant') : ''}
    ${row('Name', t.secondary_name)}
    ${row('IC / Passport', t.secondary_ic||t.secondary_ic_number)}
    ${row('Gender', t.secondary_gender)}
    ${row('Nationality', t.secondary_nationality)}
    ${row('Race', t.secondary_race)}
    ${row('Contact', t.secondary_contact)}
    ${row('Occupation', t.secondary_occupation)}
    ${row('Emergency Name', t.secondary_emergency_name)}
    ${row('Emergency Contact', t.secondary_emergency_contact)}

    <!-- REMARKS -->
    ${(t.remarks||t.note) ? section('Remarks') : ''}
    ${row('Remarks', t.remarks||t.note)}

    <button onclick="closeTenantModal()" style="width:100%;margin-top:24px;padding:13px;border-radius:12px;
      border:none;background:var(--th-bg);color:var(--ink);font-size:14px;font-weight:700;
      cursor:pointer;font-family:var(--font)">Close</button>
  `;
  $('tenantModal').classList.remove('hidden');
  document.body.style.overflow='hidden';
}

function closeTenantModal(){
  $('tenantModal').classList.add('hidden');
  document.body.style.overflow='';
}

function renderYearly(){
  const el=$('paneYearly'); if(!el) return;
  const prop=state.properties.find(p=>p.id===state.activePropId);
  if(!prop){el.innerHTML=`<div class="empty">No property data.</div>`;return;}

  const yearOpts=[state.year,state.year-1,state.year-2].map(y=>
    `<option value="${y}" ${y===state.year?'selected':''}>${y}</option>`).join('');

  el.innerHTML=`
    <div class="picker-row">
      <label>Year</label>
      <select id="yearPick" onchange="state.year=Number(this.value);renderYearly()">${yearOpts}</select>
    </div>
    <div id="yearlyContent"></div>`;
  renderYearlyContent();
}

function renderYearlyContent(){
  const el=$('yearlyContent'); if(!el) return;
  const prop=state.properties.find(p=>p.id===state.activePropId);
  const y=state.year;
  const market=Number(prop?.market_rental||0);

  const monthly=MONTHS.map((_,i)=>{
    const m=i+1;
    const income=state.payments.filter(p=>p.year===y&&p.month===m).reduce((s,p)=>s+Number(p.amount||0),0);
    const extras=state.extras.filter(e=>e.year===y&&e.month===m).reduce((s,e)=>s+Number(e.amount||0),0);
    const exp=state.expenses.filter(e=>{const d=new Date(e.date||'');return d.getFullYear()===y&&d.getMonth()+1===m;}).reduce((s,e)=>s+Number(e.amount||0),0);
    const nett=income+extras-exp;
    return {mon:MONTHS[i],m,income,extras,exp,nett};
  });

  const maxVal=Math.max(...monthly.map(x=>x.nett),market,1);
  const totalNett=monthly.reduce((s,x)=>s+x.nett,0);
  const avgNett=totalNett/12;

  const bars=monthly.map(x=>{
    const h=Math.max(0,Math.round((x.nett/maxVal)*130));
    const mh=market?Math.round((market/maxVal)*130):0;
    const color=x.nett>=market?'#00A3B5':'#F4811F';
    return `<div class="bar-col">
      <div class="bar-val" style="font-size:8px">${x.nett>0?'RM '+fmt(x.nett):''}</div>
      <div style="position:relative;width:100%;height:130px;display:flex;align-items:flex-end">
        ${market?`<div style="position:absolute;bottom:${mh}px;left:0;right:0;border-top:1.5px dashed rgba(244,129,31,.5)"></div>`:''}
        <div style="width:100%;height:${h}px;background:${color};border-radius:5px 5px 0 0;transition:height .4s"></div>
      </div>
      <div class="bar-label">${x.mon}</div>
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="card">
      <div class="card-title"><span>📈</span> Monthly Nett Income — ${y}</div>
      ${market?`<div class="legend-row">
        <div class="legend-item"><div class="legend-dot" style="background:#00A3B5"></div>≥ Market</div>
        <div class="legend-item"><div class="legend-dot" style="background:#F4811F"></div>&lt; Market</div>
        <div class="legend-item"><div style="width:20px;border-top:2px dashed rgba(244,129,31,.6)"></div>Market RM ${fmt(market)}/mo</div>
      </div>`:''}
      <div class="bar-wrap">${bars}</div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Total Nett ${y}</div><div class="stat-val orange">RM ${fmt(totalNett)}</div></div>
      <div class="stat-card"><div class="stat-label">Avg Monthly</div><div class="stat-val">RM ${fmt(avgNett)}</div></div>
      ${market?`<div class="stat-card"><div class="stat-label">Market/mo</div><div class="stat-val" style="color:var(--muted)">RM ${fmt(market)}</div></div>
      <div class="stat-card"><div class="stat-label">vs Market (avg)</div><div class="stat-val" style="color:${avgNett>=market?'#059669':'#C85900'}">${avgNett>=market?'▲':'▼'} RM ${fmt(Math.abs(avgNett-market))}</div></div>`:''}
    </div>

    <div class="card">
      <div class="card-title"><span>📋</span> Monthly Breakdown — ${y}</div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>
            <th>Month</th><th class="num">Rental</th><th class="num">Extras</th>
            <th class="num">Expenses</th><th class="num">Nett Income</th>
            ${market?`<th class="num">vs Market</th>`:''}
          </tr></thead>
          <tbody>
            ${monthly.map(x=>{
              const diff=x.nett-market;
              const hasData=x.income>0||x.extras>0||x.exp>0;
              return `<tr style="${!hasData?'opacity:.35':''}">
                <td><b>${x.mon} ${y}</b></td>
                <td class="num">RM ${fmt(x.income)}</td>
                <td class="num">RM ${fmt(x.extras)}</td>
                <td class="num" style="color:#C85900">RM ${fmt(x.exp)}</td>
                <td class="num"><b style="color:var(--orange)">RM ${fmt(x.nett)}</b></td>
                ${market?`<td class="num"><span style="color:${diff>=0?'#059669':'#C85900'};font-weight:700">${diff>=0?'+':''}RM ${fmt(diff)}</span></td>`:''}
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr>
            <td style="padding:10px 12px;font-weight:800">Total ${y}</td>
            <td class="num" style="padding:10px 12px;font-weight:800">RM ${fmt(monthly.reduce((s,x)=>s+x.income,0))}</td>
            <td class="num" style="padding:10px 12px;font-weight:800">RM ${fmt(monthly.reduce((s,x)=>s+x.extras,0))}</td>
            <td class="num" style="padding:10px 12px;font-weight:800;color:#C85900">RM ${fmt(monthly.reduce((s,x)=>s+x.exp,0))}</td>
            <td class="num" style="padding:10px 12px;font-weight:800;color:var(--orange)">RM ${fmt(totalNett)}</td>
            ${market?`<td class="num" style="padding:10px 12px;font-weight:800;color:${avgNett>=market?'#059669':'#C85900'}">${avgNett>=market?'▲':'▼'} avg RM ${fmt(Math.abs(avgNett-market))}/mo</td>`:''}
          </tr></tfoot>
        </table>
      </div>
    </div>`;
}

// TAB 4: AIRCON & ELECTRICITY
// ════════════════════════════════════════════════════════
function renderAircon(){
  const el=$('paneAircon'); if(!el) return;
  const y=state.year;
  const yearOpts=[state.year,state.year-1,state.year-2].map(yr=>
    `<option value="${yr}" ${yr===y?'selected':''}>${yr}</option>`).join('');
  el.innerHTML=`
    <div class="picker-row">
      <label>Year</label>
      <select id="airconYearPick" onchange="state.year=Number(this.value);renderAircon()">${yearOpts}</select>
    </div>
    <div id="airconContent"></div>`;
  renderAirconContent();
}

function renderAirconContent(){
  const el=$('airconContent'); if(!el) return;
  const y=state.year;
  const monthly=MONTHS.map((_,i)=>{
    const m=i+1;
    const airconTotal=state.aircon.filter(a=>{const d=new Date(a.date||'');return d.getFullYear()===y&&d.getMonth()+1===m;}).reduce((s,a)=>s+Number(a.amount||0),0);
    const bill=state.elecBills.find(b=>b.year===y&&b.month===m);
    return {mon:MONTHS[i],m,airconTotal,elecBill:bill?.amount||0};
  });
  const totalAircon=monthly.reduce((s,x)=>s+x.airconTotal,0);
  const totalElec=monthly.reduce((s,x)=>s+x.elecBill,0);

  el.innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Total Aircon ${y}</div><div class="stat-val">RM ${fmt(totalAircon)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Electricity ${y}</div><div class="stat-val orange">RM ${fmt(totalElec)}</div></div>
      <div class="stat-card"><div class="stat-label">Combined ${y}</div><div class="stat-val" style="color:#C85900">RM ${fmt(totalAircon+totalElec)}</div></div>
    </div>

    <div class="card">
      <div class="card-title"><span>❄️</span> Monthly Aircon &amp; Electricity — ${y}</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6">Enter your monthly electricity bill below to compare against aircon top-ups. Normal range: <b>RM 200–350/month</b>.</p>
      <div class="elec-grid">
        ${monthly.map(x=>{
          const diff=x.elecBill-x.airconTotal;
          return `<div class="elec-card">
            <div class="elec-month">${x.mon} ${y}</div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Electricity (RM)</div>
            <input class="elec-inp" type="number" min="0" step="0.01"
              id="elec_${y}_${x.m}" value="${x.elecBill||''}" placeholder="0.00"
              oninput="updateElecDiff(${y},${x.m})">
            <div class="elec-aircon">❄️ Aircon: <b>RM ${fmt(x.airconTotal)}</b></div>
            <div class="elec-diff" id="diff_${y}_${x.m}" style="color:${diff>0?'#C85900':diff<0?'#059669':'var(--muted)'}">
              ${x.elecBill>0?(diff>0?`⚠️ RM ${fmt(diff)} above aircon`:`✅ RM ${fmt(Math.abs(diff))} below aircon`):''}
            </div>
          </div>`;
        }).join('')}
      </div>
      <button class="btn-save-elec" onclick="saveElecBills()">💾 Save Electricity Bills</button>
    </div>

    <div class="card">
      <div class="card-title"><span>📋</span> Monthly Summary — ${y}</div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>
            <th>Month</th><th class="num">❄️ Aircon</th><th class="num">⚡ Electricity</th>
            <th class="num">Combined</th><th class="num">Difference</th>
          </tr></thead>
          <tbody>
            ${monthly.map(x=>{
              const diff=x.elecBill-x.airconTotal;
              const hasData=x.airconTotal>0||x.elecBill>0;
              return `<tr style="${!hasData?'opacity:.35':''}">
                <td><b>${x.mon} ${y}</b></td>
                <td class="num">RM ${fmt(x.airconTotal)}</td>
                <td class="num">RM ${fmt(x.elecBill)}</td>
                <td class="num"><b>RM ${fmt(x.airconTotal+x.elecBill)}</b></td>
                <td class="num"><span style="color:${diff>0?'#C85900':diff<0?'#059669':'var(--muted)'};font-weight:700">
                  ${x.elecBill>0?(diff>0?`⚠️ +RM ${fmt(diff)}`:diff<0?`✅ -RM ${fmt(Math.abs(diff))}`:'—'):'—'}
                </span></td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr>
            <td style="padding:10px 12px;font-weight:800">Total ${y}</td>
            <td class="num" style="padding:10px 12px;font-weight:800">RM ${fmt(totalAircon)}</td>
            <td class="num" style="padding:10px 12px;font-weight:800">RM ${fmt(totalElec)}</td>
            <td class="num" style="padding:10px 12px;font-weight:800">RM ${fmt(totalAircon+totalElec)}</td>
            <td></td>
          </tr></tfoot>
        </table>
      </div>
    </div>`;
}

function updateElecDiff(y,m){
  const val=Number($(`elec_${y}_${m}`)?.value||0);
  const aircon=state.aircon.filter(a=>{const d=new Date(a.date||'');return d.getFullYear()===y&&d.getMonth()+1===m;}).reduce((s,a)=>s+Number(a.amount||0),0);
  const diff=val-aircon;
  const el=$(`diff_${y}_${m}`); if(!el) return;
  if(val>0){
    el.style.color=diff>0?'#C85900':diff<0?'#059669':'var(--muted)';
    el.textContent=diff>0?`⚠️ RM ${fmt(diff)} above aircon`:diff<0?`✅ RM ${fmt(Math.abs(diff))} below aircon`:'= same as aircon';
  } else { el.textContent=''; }
}

async function saveElecBills(){
  const y=state.year;
  const rows=MONTHS.map((_,i)=>{
    const m=i+1;
    const val=Number($(`elec_${y}_${m}`)?.value||0);
    return {property_id:state.activePropId,owner_id:state.userId,year:y,month:m,amount:val};
  }).filter(r=>r.amount>0);
  try{
    if(rows.length){
      const {error}=await sb.from('owner_electricity_bills').upsert(rows,{onConflict:'property_id,year,month'});
      if(error) throw error;
    }
    const cleared=MONTHS.map((_,i)=>i+1).filter(m=>Number($(`elec_${y}_${m}`)?.value||0)===0);
    if(cleared.length){
      await sb.from('owner_electricity_bills').delete()
        .eq('property_id',state.activePropId).eq('owner_id',state.userId)
        .eq('year',y).in('month',cleared);
    }
    const {data:elec}=await sb.from('owner_electricity_bills').select('*')
      .eq('property_id',state.activePropId).eq('owner_id',state.userId);
    state.elecBills=elec||[];
    toast('✅ Electricity bills saved');
    renderAircon();
  }catch(e){toast('Save failed: '+e.message,'bad');}
}

// ── Boot ──────────────────────────────────────────────────────
(async()=>{
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});


  // Try session from storage first
  let sess=null;
  try{sess=(await sb.auth.getSession())?.data?.session||null;}catch(_){}

  // If no session, try tokens from URL (iframe preview mode)
  if(!sess){
    const params=new URLSearchParams(location.search);
    const at=params.get('at'), rt=params.get('rt');
    if(at&&rt){
      try{const{data}=await sb.auth.setSession({access_token:at,refresh_token:rt});sess=data?.session||null;}catch(_){}
    }
  }

  if(!sess){hideLoading();showLogin();return;}

  state.userId=sess.user.id;
  state.user=sess.user;

  const isPreview=new URLSearchParams(location.search).get('preview')==='1';
  const role=await getMyRole();
  if(role!=='owner'&&!isPreview){window.location.href='index.html';return;}

  if(isPreview){
    const{data:allProps}=await sb.from('properties').select('*').limit(5);
    state.properties=allProps||[];
    state.activePropId=state.properties[0]?.id||null;
    const banner=document.createElement('div');
    banner.style.cssText='background:#004C56;color:#fff;text-align:center;padding:7px;font-size:12px;font-weight:700;position:sticky;top:60px;z-index:49';
    banner.innerHTML='👁 Manager Preview Mode — <a href="index.html" style="color:#F4811F">← Back to TMS</a>';
    $('tabnav').insertAdjacentElement('afterend',banner);
    $('topbarUser').textContent=sess.user.email+' (Preview)';
    renderPropBar();
    hideLoading();showApp();
    await loadPropData();
    return;
  }

  $('topbarUser').textContent=sess.user.email;
  hideLoading();showApp();
  await loadAllData();
})();

// ── Login wiring ──────────────────────────────────────────────
(function(){
  const loginBtn=$('btnLogin'), stat=$('loginStatus');
  const emailIn=$('loginEmail'), pwIn=$('loginPassword');
  const doLogin=async()=>{
    const email=(emailIn?.value||'').trim(), pw=pwIn?.value||'';
    if(!email||!pw){stat.innerHTML='<span style="color:#C0392B">Enter email and password</span>';return;}
    loginBtn.disabled=true;loginBtn.style.opacity='.6';
    stat.innerHTML='<span style="color:#6B8E99">Signing in…</span>';
    try{
      const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error) throw error;
      state.userId=data.user.id;state.user=data.user;
      const role=await getMyRole();
      if(role!=='owner'){window.location.href='index.html';return;}
      hideLogin();
      $('topbarUser').textContent=data.user.email;
      showApp();
      await loadAllData();
    }catch(e){
      stat.innerHTML=`<span style="color:#C0392B">${esc(e.message||'Sign-in failed')}</span>`;
    }finally{loginBtn.disabled=false;loginBtn.style.opacity='';}
  };
  if(loginBtn) loginBtn.onclick=doLogin;
  [emailIn,pwIn].forEach(el=>{if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin();}});});
  $('btnSignOut').onclick=async()=>{await sb.auth.signOut();location.reload();};
})();

(function(){
  const canvas = document.getElementById('loginParticleCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, particles;
  const COUNT = 70;
  const MAX_DIST = 140;
  const COLORS = ['rgba(0,180,204,', 'rgba(0,123,138,', 'rgba(0,210,240,'];

  function resize(){
    W = canvas.width  = canvas.offsetWidth;
    H = canvas.height = canvas.offsetHeight;
  }

  function rand(min,max){ return Math.random()*(max-min)+min; }

  function makeParticle(){
    return {
      x: rand(0,W), y: rand(0,H),
      vx: rand(-0.35,0.35), vy: rand(-0.35,0.35),
      r: rand(1.5,3.5),
      alpha: rand(0.35,0.85),
      color: COLORS[Math.floor(Math.random()*COLORS.length)],
      pulse: rand(0, Math.PI*2),
      pulseSpeed: rand(0.012,0.028)
    };
  }

  function init(){
    resize();
    particles = Array.from({length:COUNT}, makeParticle);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // draw lines
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<MAX_DIST){
          const op=0.18*(1-dist/MAX_DIST);
          ctx.beginPath();
          ctx.strokeStyle=`rgba(0,180,204,${op})`;
          ctx.lineWidth=0.8;
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.stroke();
        }
      }
    }
    // draw nodes
    particles.forEach(p=>{
      p.pulse += p.pulseSpeed;
      const glow = 0.3+0.2*Math.sin(p.pulse);
      // outer glow
      const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0, p.color+(p.alpha*glow*0.5).toFixed(3)+')');
      g.addColorStop(1, p.color+'0)');
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2);
      ctx.fillStyle=g;
      ctx.fill();
      // core
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color+p.alpha.toFixed(3)+')';
      ctx.fill();
    });
  }

  function update(){
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-20) p.x=W+20;
      else if(p.x>W+20) p.x=-20;
      if(p.y<-20) p.y=H+20;
      else if(p.y>H+20) p.y=-20;
    });
  }

  let raf;
  function loop(){ draw(); update(); raf=requestAnimationFrame(loop); }

  // Only run when login overlay is visible
  function startAnim(){
    if(raf) return;
    init();
    loop();
  }
  function stopAnim(){
    cancelAnimationFrame(raf); raf=null;
  }

  // Observe visibility
  const overlay = canvas.closest('#loginOverlay');
  if(overlay){
    const mo = new MutationObserver(()=>{
      if(!overlay.classList.contains('hidden')){ startAnim(); }
      else { stopAnim(); }
    });
    mo.observe(overlay, {attributes:true, attributeFilter:['class']});
    if(!overlay.classList.contains('hidden')) startAnim();
  } else { startAnim(); }

  window.addEventListener('resize', ()=>{ if(raf){ resize(); particles=Array.from({length:COUNT},makeParticle); }});
})();

</script>
